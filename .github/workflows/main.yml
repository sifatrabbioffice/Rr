        run: |
          echo "══════════════════════════════════════════════"
          echo "  ✅ GAMEHUB PRO BUILD COMPLETE"
          echo "══════════════════════════════════════════════"
          echo "  IPA:      $(ls -lh build/GameHub_Pro_v3.ipa | awk '{print $5}')"
          echo "  Engine:   FEX-Core x86→ARM64"
          echo "  Graphics: DXVK+VKD3D → MoltenVK → Metal"
          echo "  Target:   iPhone 15 Pro Max (A17 Pro)"
          echo "  JIT:      StikDebug / SideStore"
          echo "══════════════════════════════════════════════"
