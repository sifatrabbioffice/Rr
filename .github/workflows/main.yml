          struct AnalogStickView: View {
              let label: String
              var onMove: (CGPoint) -> Void
              @State private var offset = CGSize.zero
              let maxRadius: CGFloat = 38
              
              var body: some View {
                  ZStack {
                      // Outer ring
                      Circle()
                          .fill(Color.white.opacity(0.06))
                          .frame(width: 130, height: 130)
                          .overlay(Circle().stroke(Color.white.opacity(0.1), lineWidth: 1))
                      // Stick knob
                      Circle()
                          .fill(
                              RadialGradient(
                                  colors: [Color(white:0.25), Color(white:0.08)],
                                  center: .center, startRadius: 0, endRadius: 35
                              )
                          )
                          .frame(width: 72, height: 72)
                          .overlay(Circle().stroke(Color.white.opacity(0.15), lineWidth: 1))
                          .shadow(color: .black.opacity(0.5), radius: 4, x: 2, y: 2)
                          .offset(offset)
                          .gesture(
                              DragGesture(minimumDistance: 0)
                                  .onChanged { v in
                                      let d = sqrt(v.translation.width*v.translation.width + v.translation.height*v.translation.height)
                                      let clamped = d > maxRadius
                                          ? CGSize(width: v.translation.width/d*maxRadius, height: v.translation.height/d*maxRadius)
                                          : v.translation
                                      offset = clamped
                                      onMove(CGPoint(x: clamped.width/maxRadius, y: clamped.height/maxRadius))
                                  }
                                  .onEnded { _ in
                                      withAnimation(.spring(response: 0.25, dampingFraction: 0.6)) {
                                          offset = .zero
                                      }
                                      onMove(.zero)
                                  }
                          )
                      Text(label)
                          .font(.system(size: 9, weight: .bold, design: .monospaced))
                          .foregroundColor(Color.white.opacity(0.2))
                          .offset(y: 46)
                  }
              }
          }

